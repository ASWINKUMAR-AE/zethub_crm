<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Zethub CRM Login</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "outline": "#777777",
                        "primary": "#000000",
                        "on-tertiary-fixed": "#ffffff",
                        "tertiary-fixed-dim": "#464747",
                        "on-secondary-fixed": "#1b1c1c",
                        "error": "#ba1a1a",
                        "surface-dim": "#dadada",
                        "surface-variant": "#e2e2e2",
                        "surface-bright": "#f9f9f9",
                        "error-container": "#ffdad6",
                        "on-secondary-container": "#1b1c1c",
                        "on-background": "#1a1c1c",
                        "secondary": "#5f5e5e",
                        "primary-fixed": "#5e5e5e",
                        "on-tertiary-container": "#ffffff",
                        "surface-container-high": "#e8e8e8",
                        "inverse-primary": "#c6c6c6",
                        "surface": "#f9f9f9",
                        "secondary-container": "#d6d4d3",
                        "tertiary-fixed": "#5e5e5e",
                        "on-tertiary": "#e3e2e2",
                        "on-secondary-fixed-variant": "#3b3b3b",
                        "secondary-fixed": "#c8c6c6",
                        "on-secondary": "#ffffff",
                        "inverse-on-surface": "#f1f1f1",
                        "on-error-container": "#410002",
                        "on-primary-fixed": "#ffffff",
                        "surface-container-low": "#f3f3f3",
                        "on-tertiary-fixed-variant": "#e3e2e2",
                        "background": "#f9f9f9",
                        "surface-container-lowest": "#ffffff",
                        "tertiary": "#3b3b3c",
                        "tertiary-container": "#747474",
                        "surface-container": "#eeeeee",
                        "inverse-surface": "#2f3131",
                        "on-primary": "#e2e2e2",
                        "surface-tint": "#5e5e5e",
                        "on-primary-container": "#ffffff",
                        "primary-container": "#3b3b3b",
                        "outline-variant": "#c6c6c6",
                        "primary-fixed-dim": "#474747",
                        "on-surface-variant": "#474747",
                        "on-primary-fixed-variant": "#e2e2e2",
                        "surface-container-highest": "#e2e2e2",
                        "secondary-fixed-dim": "#acabaa",
                        "on-surface": "#1a1c1c",
                        "on-error": "#ffffff"
                    },
                    fontFamily: {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9f9f9;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
            font-size: 20px;
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /* Ambient Shadow for focused elements */
        .ambient-shadow {
            shadow: 0 32px 64px rgba(26, 28, 28, 0.05);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex items-center justify-center p-6">
<!-- Login Container -->
<main class="w-full max-w-[390px] mx-auto flex flex-col items-center">
<!-- Branding Header -->
<header class="mb-12 text-center">
<div class="mb-4 inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-primary text-on-primary">
<span class="material-symbols-outlined text-3xl" data-icon="grid_view">grid_view</span>
</div>
<h1 class="text-3xl font-extrabold tracking-tighter text-primary">Zethub</h1>
<p class="text-on-surface-variant text-sm mt-2 font-medium">Enterprise CRM Solutions</p>
</header>
<!-- Login Card -->
<section class="w-full bg-surface-container-lowest rounded-2xl p-8 shadow-[0_32px_64px_rgba(0,0,0,0.04)] border border-outline-variant/10">
<div class="space-y-6">
<!-- Email Input Group -->
<div class="space-y-2">
<label class="block text-[10px] font-semibold uppercase tracking-widest text-on-surface-variant px-1" for="email">Email</label>
<div class="relative group">
<input class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3.5 text-on-surface text-sm placeholder:text-outline/50 focus:ring-1 focus:ring-primary/20 transition-all outline-none" id="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Input Group -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="block text-[10px] font-semibold uppercase tracking-widest text-on-surface-variant" for="password">Password</label>
<a class="text-[10px] font-semibold uppercase tracking-widest text-on-surface-variant hover:text-primary transition-colors" href="#">Forgot?</a>
</div>
<div class="relative group">
<input class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3.5 text-on-surface text-sm placeholder:text-outline/50 focus:ring-1 focus:ring-primary/20 transition-all outline-none" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Sign In Button -->
<button class="w-full bg-primary text-on-primary font-semibold py-4 rounded-xl hover:opacity-90 active:scale-[0.98] transition-all text-sm shadow-lg shadow-primary/5">
                    Sign In
                </button>
</div>
<!-- Alternative Sign In -->
<div class="mt-8 pt-8 border-t border-outline-variant/20">
<p class="text-center text-[10px] font-semibold uppercase tracking-widest text-outline mb-4">Or continue with</p>
<div class="grid grid-cols-2 gap-3">
<button class="flex items-center justify-center gap-2 bg-surface-container-high py-3 rounded-xl hover:bg-surface-variant transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-lg" data-icon="shield_person">shield_person</span>
<span class="text-xs font-semibold">SSO</span>
</button>
<button class="flex items-center justify-center gap-2 bg-surface-container-high py-3 rounded-xl hover:bg-surface-variant transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-lg" data-icon="fingerprint">fingerprint</span>
<span class="text-xs font-semibold">Bio</span>
</button>
</div>
</div>
</section>
<!-- Footer Links -->
<footer class="mt-8 flex flex-col items-center gap-4">
<p class="text-on-surface-variant text-xs">
                Don't have an account? <a class="text-primary font-bold hover:underline" href="#">Request access</a>
</p>
<div class="flex gap-6 mt-4">
<a class="text-[10px] font-medium text-outline hover:text-on-surface transition-colors" href="#">Privacy</a>
<a class="text-[10px] font-medium text-outline hover:text-on-surface transition-colors" href="#">Terms</a>
<a class="text-[10px] font-medium text-outline hover:text-on-surface transition-colors" href="#">Support</a>
</div>
</footer>
</main>
<!-- Background Decorative Elements -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
<div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-surface-container-highest rounded-full blur-[120px] opacity-40"></div>
<div class="absolute top-[60%] -right-[5%] w-[30%] h-[30%] bg-surface-container-high rounded-full blur-[100px] opacity-30"></div>
</div>
</body></html>
